version: 8

manifests:
  glob: domains/*/domain.yaml
  schema: config/schema.yaml#/$defs/domain_manifest
  directory_name_must_equal_manifest_id: true
  aggregate_output: generated/taxonomy.yaml
  aggregate_is_canonical: false
  aggregate_committed_by_default: false
  subdomain_scope_definition_field: description

identity_scope:
  domain_id: repository-wide
  domain_code: repository-wide
  subdomain_id: within-domain
  subdomain_code: within-domain

universal_files:
  principles:
    type: principles
    requires_domain_status: accepted
  personal-growth:
    type: personal-growth
    requires_domain_status: accepted

naming:
  directory_style: kebab-case
  file_style: kebab-case

lifecycle:
  values: [proposed, accepted, deprecated]
  content_coverage_is_derived: true
  origin_proves_acceptance: false
  undocumented_research_origin_is_provisional: true
  proposed_domain:
    allowed_subdomain_statuses: [proposed, deprecated]
  accepted_domain:
    allowed_subdomain_statuses: [proposed, accepted, deprecated]
    required_subdomain_status: accepted
  deprecated_domain:
    allowed_subdomain_statuses: [deprecated]
    required_subdomains_must_be_empty: true
  accepted_subdomain_requires_accepted_domain: true
  allowed_transitions:
    proposed: [accepted, deprecated]
    accepted: [deprecated]
    deprecated: [accepted]

operations:
  add:
    new_id_required: true
    initial_working_status: proposed
    trusted_diff_may_finish_accepted_after_exact_human_decision: true
  rename:
    preserve_id: true
    change_fields: [title]
  reframe:
    preserve_id_when_semantic_identity_remains: true
    change_fields: [description]
  deprecate:
    retained_status: deprecated
    corpus_file_must_be_absent: true
  reactivate:
    transition: deprecated-to-accepted
  replace:
    old_scope_transition: to-deprecated
    replacement_scope: new-proposed-id
  split:
    original_scope_transition: to-deprecated
    minimum_new_proposed_scopes: 2
  merge:
    absorbed_scope_transition: to-deprecated
    survivor: existing-accepted-or-new-proposed

explicit_target_request:
  existing_proposed_registered_scope_with_unchanged_definition: authorizes_acceptance_after_independent_agent_research_confirms_fit
  addition_rename_reframe_merge_split_replace_deprecation_or_reactivation: requires_human_approval
  protected_intent_change: requires_human_approval
  canonical_review_sidecar_required: false
  decision_rationale_location_when_material: pull_request_or_issue_record

transition_validation:
  baseline: trusted_merge_base
  domain_and_subdomain_removal_allowed: false
  accepted_to_proposed_allowed: false
  protected_intent_change_requires_human_approval: true
  proposed_to_accepted_classification: taxonomy-acceptance
  proposed_to_accepted_may_be_satisfied_by_explicit_unchanged_target_request: true
  explicit_authorization_target_format: domain-or-domain-slash-subdomain
  authorized_acceptance_is_reported_as_routine_transition_not_human_gate: true
  authorization_does_not_prove_semantic_fit_or_human_approval: true
  proposed_or_accepted_to_deprecated_classification: taxonomy-deprecation
  deprecated_to_accepted_classification: taxonomy-reactivation
  deprecated_to_proposed_allowed: false
  new_scope_classification: taxonomy-addition
  new_scope_requires_human_approval: true
  deprecation_and_reactivation_require_human_approval: true
  existing_domain_or_subdomain_definition_change_requires_human_approval: true
  new_scope_working_state_starts_proposed: true
  exact_human_approved_addition_may_finish_accepted_in_same_outcome: true
  unavailable_baseline_result: not_evaluated

human_intent:
  field: human_intent
  domain_purpose_field: description
  required_subdomains_field: required_subdomains
  protected_changes:
    - removal
    - rename
    - merge
    - split
    - replacement
    - deprecation
    - material_rescope
    - domain_purpose_change
  explicit_human_approval_required: true

semantic_review:
  research_standard: docs/standards/research.md
  source_standard: docs/standards/sources.md
  inherited_or_registered_taxonomy_is_context_not_evidence: true
  independent_evidence_landscape_required: true
  source_fitness_required: true
  intentional_cross_domain_overlap_allowed_when_context_materially_changes_guidance: true

registration:
  existing_subdomain_markdown_must_be_registered: true
  registered_subdomain_markdown_may_be_missing: true
  universal_files_may_be_missing_during_incremental_build: true
  required_subdomain_must_not_be_deprecated: true
  accepted_content_requires_accepted_scope: true
  deprecated_scope_must_not_have_corpus_file: true

principle_identity:
  policy: config/identity-policy.yaml
  pattern: '^PRN-[0-9]{6}$'
  derived_from_domain_or_file_code: false
  moves_preserve_id: true
  splits_allocate_new_ids: true
  merges_preserve_one_id: true
  replaced_relationship_required: true
  retired_ids_reusable: false
