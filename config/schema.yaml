version: 1

domain_manifest:
  required:
    - schema_version
    - id
    - code
    - title
    - status
    - description
    - required_subdomains
    - subdomains
  constraints:
    schema_version: 1
    id_pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    code_pattern: "^[A-Z]{2,4}$"
    status_values:
      - active
      - deprecated
    required_subdomains_type: list
    subdomains_type: list
  subdomain:
    required:
      - id
      - code
      - title
      - status
      - origin
    constraints:
      id_pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      code_pattern: "^[A-Z0-9]{2,5}$"
      status_values:
        - active
        - deprecated
      origin_values:
        - user
        - research
        - mixed
        - policy

file:
  frontmatter:
    required:
      - schema_version
      - id
      - title
      - domain
      - type
      - status
      - last_reviewed
      - tags
    optional:
      - subdomain
    constraints:
      schema_version: 1
      id_pattern: "^[a-z0-9-]+\\.(principles|personal-growth|[a-z0-9-]+)$"
      type_values:
        - principles
        - personal-growth
        - subdomain
      status_values:
        - active
        - draft
        - deprecated
      date_format: "YYYY-MM-DD"
      tags_type: list
      subdomain_required_when_type: subdomain

  headings:
    title_level: 1
    principles_level: 2
    entry_level: 3
    subsection_level: 4
    references_level: 2

entry:
  heading:
    pattern: "^[A-Z]{2,4}-[A-Z0-9]{2,5}-[0-9]{3} — .+$"
  required_parts:
    - principle_statement
    - why
    - practices
    - goals
    - tags
  section_order:
    - why
    - practices
    - goals
    - tags
  lists:
    practices: bullet
    goals: bullet
    tags: bullet

references:
  label_pattern: "^[1-9][0-9]*$"
  local_to_file: true
  visible_references_section_required: true
  definitions_required: true
