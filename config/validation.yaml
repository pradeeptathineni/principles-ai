version: 13

schema_validation:
  draft: '2020-12'
  schema_document_id: https://principles.local/config/schema/v6
  format_assertion_required: true
  unsupported_schema_versions: error
  unknown_canonical_fields: error
  supported_record_versions:
    domain_manifest: 6
    corpus_frontmatter: 5
    source_record: 4
    claim_review_record: 4
    identity_ledger: 2
    evaluator_configuration_record: 2

yaml_loading:
  version: '1.2'
  schema: core
  preserve_date_and_uri_scalars_as_strings: true
  utf8_byte_order_mark_allowed: false
  anchors_aliases_merge_keys_and_custom_tags_allowed: false
  input_byte_and_node_limits_required: true

canonical_text:
  applies_to: canonical_and_executable_repository_files
  excluded_globs: [docs/reviews/**]
  encoding: utf-8
  unicode_normalization: NFC
  line_endings: LF
  final_newline_required: true
  trailing_whitespace_allowed: false
  canonical_metadata_strings_must_be_trimmed_and_nonempty: true

policy_loading:
  unsupported_policy_versions: error
  unknown_policy_fields: error
  migrations_must_be_explicit: true
  data_loss_requires_rationale_and_human_approval: true
  silent_coercion_or_upgrade_allowed: false
  supported_versions:
    content-policy: 6
    evidence-policy: 4
    identity-policy: 2
    source-policy: 6
    taxonomy-policy: 9
    validation: 13

trusted_baseline:
  pull_request_source: merge_base_with_trusted_target_branch
  policy_for_policy_change_review: merge_base
  identity_source_taxonomy_and_corpus_transition_state: merge_base
  deterministic_check_changes_require_versioned_policy_migration: true
  proposed_policy_must_not_select_or_redefine_baseline: true
  unavailable_transition_baseline_result: not_evaluated
  pull_request_ci_must_not_report_full_transition_success_when_unavailable: true

classes:
  deterministic:
    blocking_in_ci: true
    checks:
      - yaml_and_frontmatter_parse
      - duplicate_yaml_key
      - safe_yaml_construction
      - forbidden_yaml_anchor_alias_merge_or_custom_tag
      - bounded_input_bytes_and_yaml_nodes
      - executable_schema_with_format_assertion
      - unknown_canonical_field
      - supported_schema_and_policy_version
      - canonical_text_encoding_normalization_and_newlines
      - manifest_path_and_registration
      - taxonomy_identity_uniqueness_scope
      - taxonomy_lifecycle_consistency
      - taxonomy_transition_against_trusted_base
      - protected_intent_transition_against_trusted_base
      - deprecated_scope_without_corpus
      - protected_subdomain_presence_and_status
      - corpus_path_frontmatter_agreement
      - corpus_review_hash_and_transition
      - principle_and_source_identity
      - identity_ledger_sequence_and_retirement
      - identity_ledger_transition_against_trusted_base
      - principle_relationship_direction_and_acyclicity
      - principle_relationship_transition_against_trusted_base
      - source_filename_and_ledger_agreement
      - source_record_persistence_against_trusted_base
      - source_url_registry_uniqueness
      - source_url_normalized_storage
      - source_url_transition_against_trusted_base
      - source_url_userinfo_and_fragment_policy
      - source_lifecycle_consistency
      - source_supersession_acyclicity
      - heading_and_section_grammar
      - title_projection_and_exact_equality
      - structural_citation_presence
      - citation_run_grammar
      - claim_block_link_title_policy
      - reference_resolution
      - bibliography_one_to_one_source_mapping
      - advisory_word_economy
      - internal_link_resolution
      - evidence_filename_and_entry_agreement
      - evaluator_configuration_schema_path_and_i_json_input
      - claim_review_coverage_and_unique_roles
      - claim_review_source_and_locator_agreement
      - evaluator_configuration_reference_and_hash_agreement
      - claim_review_hash_match
      - claim_review_publishable_outcome
      - generated_output_reproducibility
      - workflow_model_consistency
      - workflow_route_reachability
      - architecture_change_classification
      - domain_preparation_workset
      - task_scoped_gate_reporting
      - source_usage_reporting
      - transactional_mutation_preconditions_and_rollback
      - canonical_writer_serialization
      - atomic_identity_and_source_registration
      - batch_source_registration
      - batch_content_materialization
      - citation_bibliography_synchronization
      - domain_citation_synchronization
      - evidence_review_invalidation_scaffold
      - run_checkpoint_binding
      - run_checkpoint_invalidation
      - activation_decision_package_binding_verification
      - activation_human_review_projection
      - activation_manifest_derivation
  operational:
    blocking_in_pull_request_ci: false
    checks:
      - external_url_reachability
      - redirect_behavior
      - source_content_change
      - review_due_report
      - head_get_method_fallback
  semantic:
    blocking_in_ci_until_calibrated: false
    checks:
      - citation_entailment
      - evidence_landscape_before_synthesis
      - stronger_available_source_substitution_reason
      - source_fitness
      - source_url_secret_exposure
      - claim_calibration
      - hidden_external_claim
      - taxonomy_fit
      - taxonomy_independent_research
      - taxonomy_scope_definition_fitness
      - intentional_cross_domain_overlap
      - duplicate_meaning
      - disagreement_handling
      - durability
      - human_readability
      - workflow_prerequisite_sufficiency
      - workflow_composition
      - human_gate_necessity
      - state_ownership_clarity
      - authority_and_implementation_alignment
      - deterministic_semantic_boundary
      - context_efficiency
      - natural_language_outcome_resolution
      - candidate_discovery_breadth
      - candidate_coverage_analysis
      - candidate_comparison_and_consolidation
      - subject_determined_final_selection
      - generation_shaped_uniformity
  human_approval:
    gates:
      deterministic:
        - architecture-review
        - evidence-policy-change
        - governance-or-ci-change
        - policy-or-schema-change
        - principle-activation
        - principle-removal
        - principle-semantic-change
        - protected-intent-change
        - taxonomy-acceptance
        - taxonomy-addition
        - taxonomy-definition-change
        - taxonomy-deprecation
        - taxonomy-reactivation
      semantic:
        - unresolved-material-disagreement
      manual_only: []

workflow_model:
  version: 1
  defaults:
    prerequisite_owner: agent
    mutation_owner: agent
    semantic_review_owner: ai_or_human
    consequential_decision_owner: human
    resume_parent_after_prerequisite_or_gate: true
    terminal_action: outcome-satisfied
  outcomes:
    - id: create-or-complete-content
      route: docs/workflows/create-content.md
      inspector: content-target
    - id: fully-furnish-domain
      route: docs/workflows/furnish-domain.md
      inspector: domain-furnishing
    - id: refine-domain-content
      route: docs/workflows/furnish-domain.md
      inspector: domain-refinement
    - id: create-domain
      route: docs/workflows/create-domain.md
      inspector: new-domain
    - id: update-taxonomy
      route: docs/workflows/update-taxonomy.md
      inspector: ai-routed-with-deterministic-transitions
    - id: update-content
      route: docs/workflows/update-content.md
      inspector: ai-routed-with-deterministic-transitions
    - id: review-content
      route: docs/workflows/review-content.md
      inspector: ai-routed-with-deterministic-validation
    - id: review-architecture
      route: docs/workflows/review-architecture.md
      inspector: ai-routed-with-deterministic-support
  supporting_routes:
    - docs/workflows/orchestrate-outcome.md
    - docs/workflows/bootstrap.md
  action_ids:
    agent:
      - independently-research-and-prepare-new-domain
      - independently-research-and-prepare-new-subdomain-definition
      - independently-research-and-prepare-domain-reactivation-decision
      - independently-research-and-prepare-subdomain-reactivation-decision
      - research-target-fit-and-accept-unchanged-requested-scope
      - research-target-fit-and-accept-unchanged-requested-domain
      - research-and-create-content-draft
      - complete-semantic-and-adversarial-content-review
      - independently-evaluate-proposed-subdomains-for-acceptance-deprecation-or-unresolved
      - run-create-content-for-missing-furnishing-targets
      - run-substantive-update-content-for-all-domain-targets
      - complete-per-file-semantic-and-adversarial-review
      - run-domain-cross-file-consistency-and-quality-review
      - follow-canonical-outcome-workflow
    terminal: [outcome-satisfied]

architecture_review:
  route: docs/workflows/review-architecture.md
  trigger_groups:
    routing:
      - AGENTS.md
      - README.md
    governance:
      - docs/architecture.md
      - docs/project.md
      - docs/schema-versions.md
    workflows:
      - docs/workflows/
    standards:
      - docs/standards/
    executable-policy:
      - config/
    tooling:
      - src/
      - bin/
      - scripts/
      - package.json
      - package-lock.json
      - .node-version
    tests:
      - tests/
    evaluator-authority:
      - evals/
    ci:
      - .github/
  excluded_paths:
    - config/identity-ledger.yaml
    - docs/reviews/
  minimum_context:
    - AGENTS.md
    - docs/architecture.md
    - docs/workflows/review-architecture.md
    - config/validation.yaml

severity:
  first_use_citation_numbering: warning
  insecure_http_source_url: warning
  unused_bibliography_entry_or_definition: error
  indeterminate_network_result: informational
  unsupported_schema_or_policy_version: error

diagnostic_language:
  citation_presence_proves_entailment: false
  source_review_due_means_semantically_stale: false
  schema_validity_proves_cross_file_validity: false
  evaluator_completion_proves_semantic_correctness: false
  snapshot_validation_proves_all_time_identity_transition: false

internal_links:
  scope: current_nonhistorical_repository_markdown
  glob_semantics: gitignore_style_repo_relative_with_double_star_matching_zero_or_more_directories
  included_globs:
    - AGENTS.md
    - README.md
    - .github/**/*.md
    - config/templates/*.md
    - docs/**/*.md
    - domains/**/*.md
    - evidence/**/*.md
    - evals/**/*.md
    - generated/**/*.md
    - prompts/**/*.md
    - scripts/**/*.md
    - sources/**/*.md
    - tests/**/*.md
  excluded_globs: [docs/reviews/**]
  repository_relative_paths_must_not_escape_repository: true
  symlink_targets_must_remain_within_repository: true
  internal_destination: gfm_parsed_destination_without_uri_scheme
  allowed_destination_form: relative_repository_path
  query_allowed: false
  percent_encoded_path_octets_allowed: false
  validate_existing_path_component: true
  fragments:
    current_internal_fragment_links_present: false
    validation: deferred_until_first_use_and_explicit_slug_contract
    path_validation_still_required_when_fragment_present: true
