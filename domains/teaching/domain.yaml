schema_version: 6
id: teaching
code: TEA
title: Teaching
taxonomy_status: accepted
description: Principles for helping people learn effectively across curriculum, tutoring,
  classroom, virtual, assessment, accessibility, and learner-support contexts.
human_intent:
  required_subdomains:
  - tutoring
  - classroom
  - virtual
  - students
  - teachers
  - parents
  priorities: []
  exclusions: []
  scope_notes: []
