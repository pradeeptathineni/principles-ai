- id: tutoring
  code: TUT
  title: Tutoring
  description: "Tutoring concerns direct instructional interactions with one learner or a small group, distinct from classroom-wide teaching and program-level curriculum or policy."
  status: accepted
  origin: mixed
- id: classroom
  code: CLS
  title: Classroom
  description: "Classroom concerns whole-group teaching environments, routines, participation, and instruction, distinct from individualized tutoring and curriculum-level design."
  status: accepted
  origin: mixed
- id: virtual
  code: VIR
  title: Virtual
  description: "Virtual teaching concerns remote and technology-mediated learning contexts where delivery, interaction, access, and presence materially change instruction."
  status: accepted
  origin: mixed
- id: students
  code: STU
  title: Students
  description: "Students concerns learner agency, participation, study practices, support needs, and responsibilities within teaching relationships."
