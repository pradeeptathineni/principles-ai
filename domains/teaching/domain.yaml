- id: curriculum
  code: CUR
  title: Curriculum
  description: "Covers Curriculum as part of helping people learn effectively across curriculum, tutoring, classroom, virtual, assessment, accessibility, and learner-support contexts, with ownership where this context materially changes decisions, evidence, or application."
